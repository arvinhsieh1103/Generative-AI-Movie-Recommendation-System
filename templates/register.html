<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
    }

    .header {
      margin-bottom: 20px;
      font-size: 28px;
      font-weight: bold;
      color: #333;
      text-align: center;
    }

    .register-container {
      background: #ffffff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 320px;
      text-align: center;
    }

    .register-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 15px;
      color: #555;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      box-sizing: border-box;
      text-align: center;
    }

    .register-btn {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .register-btn:hover {
      background-color: #0056b3;
    }

    .error-message {
      color: red;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">Movie Recommendation</div>
  <div class="register-container">
    <h2>Register</h2>
    <form id="registerForm" action="/register" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required />
      </div>
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="">Select Gender</option>
          <option value="M">Male</option>
          <option value="F">Female</option>
        </select>
      </div>
      <div class="form-group">
        <label for="age">Age</label>
        <select id="age" name="age" required>
          <option value="">Select Age Range</option>
          <option value="1">Under 18</option>
          <option value="18">18-24</option>
          <option value="25">25-34</option>
          <option value="35">35-44</option>
          <option value="45">45-49</option>
          <option value="50">50-55</option>
          <option value="56">56+</option>
        </select>
      </div>
      <div class="form-group">
        <label for="occupation">Occupation</label>
        <select id="occupation" name="occupation" required>
          <option value="">Select Occupation</option>
          <option value="0">Other</option>
          <option value="1">Academic/Educator</option>
          <option value="2">Artist</option>
          <option value="3">Clerical/Admin</option>
          <option value="4">College/Grad Student</option>
          <option value="5">Customer Service</option>
          <option value="6">Doctor/Health Care</option>
          <option value="7">Executive/Managerial</option>
          <option value="8">Farmer</option>
          <option value="9">Homemaker</option>
          <option value="10">K-12 Student</option>
          <option value="11">Lawyer</option>
          <option value="12">Programmer</option>
          <option value="13">Retired</option>
          <option value="14">Sales/Marketing</option>
          <option value="15">Scientist</option>
          <option value="16">Self-Employed</option>
          <option value="17">Technician/Engineer</option>
          <option value="18">Tradesman/Craftsman</option>
          <option value="19">Unemployed</option>
          <option value="20">Writer</option>
        </select>
      </div>
      <button type="submit" class="register-btn">Register</button>
    </form>

    <div style="margin-top: 15px; font-size: 14px; text-align: center;">
      已有帳號? 
      <a href="/login" style="color: #007bff; text-decoration: none;">點此登入</a>
    </div>

    <script>
      {% if error %}
        const errorMessage = {{ error | tojson }};
        alert(errorMessage);
      {% endif %}
    </script>

  </div>
</body>
</html>
