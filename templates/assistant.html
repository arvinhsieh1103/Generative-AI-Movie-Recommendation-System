<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>🎬 AI 電影推薦助手</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #1e1e1e;
      color: #f5f5f5;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    /* 頂部導覽列 */
    .top-bar {
      background: #2a2a2a;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
    }

    .top-bar a {
      text-decoration: none;
      margin-left: 20px;
      font-weight: 600;
      color: #f5f5f5;
      transition: color 0.2s;
    }

    .top-bar a:hover {
      color: #00bfff;
    }

    /* 主內容 */
    .container {
      max-width: 700px;
      margin: 120px auto;
      background: #2a2a2a;
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 30px;
    }

    textarea {
      width: 90%;
      height: 120px;
      border-radius: 10px;
      border: none;
      padding: 15px;
      font-size: 1.1rem;
      resize: none;
      background: #3a3a3a;
      color: #fff;
      box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);
      transition: all 0.2s;
    }

    textarea:focus {
      outline: none;
      background: #444;
      box-shadow: 0 0 8px #00bfff;
    }

    button {
      margin-top: 25px;
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      background-color: #00bfff;
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #0095cc;
      transform: scale(1.03);
    }

    button:active {
      transform: scale(0.98);
    }

    .error {
      color: #ff5555;
      margin-top: 15px;
      font-size: 1rem;
    }

    @media (max-width: 600px) {
      .container {
        margin: 80px 20px;
        padding: 30px 20px;
      }
      textarea {
        height: 100px;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>
      👤 Welcome,<strong>{{ username }}!</strong>
    </div>
    <div>
      <a href="/search">🔍 返回搜尋</a>
      <a href="/favorites">❤️ 我的最愛</a>
      <a href="/rankings">📊 排行榜</a>
      <a href="/logout">🚪 登出</a>
    </div>
  </div>

  <!-- 主頁內容 -->
  <div class="container">
    <h1>🤖 AI 電影推薦助手</h1>
    <p>輸入一句話描述你想看的電影，讓 AI 幫你找出完美的推薦！</p>

    <form method="POST" action="/assistant/recommend">
      <textarea name="prompt" placeholder="例如：我想看浪漫又有奇幻元素的電影..."></textarea><br>
      <button type="submit">✨ 生成推薦</button>
    </form>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
  </div>
</body>
</html>
