<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>我的最愛</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    .top-bar {
      background: #e0e0e0;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ccc;
    }

    .top-bar a {
      text-decoration: none;
      margin-left: 15px;
      font-weight: 700;
      color: #333;
    }

    .top-bar a:hover {
      color: #007BFF;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    .movie {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      align-items: center;
    }

    .movie img {
      width: 120px;
      height: auto;
      margin-right: 20px;
      border-radius: 6px;
    }

    .movie-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .movie-title a {
      text-decoration: none;
      color: #333;
      font-size: 20px;
      font-weight: bold;
    }

    .movie-title a:hover {
      color: #007BFF;
    }

    /* ❤️ 取消最愛按鈕 */
    .unfav-btn {
      background-color: #ffa500; 
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 16px;           
      font-weight: 600;
      border-radius: 8px;       
      cursor: pointer;
      transition: 0.2s ease-in-out;
      margin-top: 10px;
      width: 140px;              
    }

    .unfav-btn:hover {
      background-color: #d9363e;
    }

    .no-fav {
      text-align: center;
      color: #777;
      font-size: 18px;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>
      👤 Welcome, <strong>{{ username }}!</strong>
    </div>
    <div>
      <a href="/assistant">🤖 電影推薦助手阿蓋</a>
      <a href="/search">🔍 返回搜尋</a>
      <a href="/rankings">📊 排行榜</a>
      <a href="/logout">🚪 登出</a>
    </div>
  </div>

  <div class="container">
    <h2>❤️ 我的最愛清單</h2>

    {% if favorites %}
      {% for movie in favorites %}
        <div class="movie" id="movie-{{ movie.MovieID }}">
          <a href="/movie/{{ movie.MovieID }}">
            <img src="{{ movie.image }}" alt="{{ movie.Title }} poster" />
          </a>

          <div class="movie-info">
            <div class="movie-title">
              <a href="/movie/{{ movie.MovieID }}">{{ movie.Title }}</a>
            </div>
          </div>

          <!-- 💔 取消最愛按鈕 -->
          <button class="unfav-btn" onclick="removeFavorite({{ movie.MovieID }})">
            💔 取消最愛
          </button>

        </div>
      {% endfor %}
    {% else %}
      <p class="no-fav">尚未加入任何電影到最愛。</p>
    {% endif %}
  </div>

<script>
async function removeFavorite(movieId) {
  const res = await fetch("/favorite", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ movie_id: movieId, favorite: false })
  });

  const data = await res.json();
  if (data.success) {
    // ✅ 直接移除該電影區塊
    document.getElementById(`movie-${movieId}`).remove();

    // ✅ 如果全部刪光了，顯示「尚未加入任何電影到最愛」
    if (document.querySelectorAll(".movie").length === 0) {
      document.querySelector(".container").innerHTML += `
        <p class="no-fav">尚未加入任何電影到最愛。</p>
      `;
    }
  } else {
    alert("取消失敗：" + (data.message || "請稍後再試"));
  }
}
</script>

</body>
</html>
