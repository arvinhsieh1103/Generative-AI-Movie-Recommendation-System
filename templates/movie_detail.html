<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ movie.Title }}</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
    .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; }
    .movie-poster { width: 300px; border-radius: 10px; }
    .favorite-btn {
      padding: 10px 20px;
      background: {% if is_favorite %}#ff4444{% else %}#007BFF{% endif %};
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>{{ movie.Title }}</h1>
    <img src="{{ movie.image }}" class="movie-poster" alt="{{ movie.Title }}">

    <p><strong>類型：</strong>{{ movie.Genres }}</p>
    <p><strong>電影 ID：</strong>{{ movie.MovieID }}</p>

    <!-- 加入/取消最愛按鈕 -->
    <button 
      class="favorite-btn" 
      onclick="toggleFavorite({{ movie.MovieID }})">
      {% if is_favorite %}✅ 已加入最愛{% else %}❤️ 加入最愛{% endif %}
    </button>

    <p><a href="/search">⬅ 返回搜尋</a></p>
  </div>

  <script>
    async function toggleFavorite(movieId) {
      const res = await fetch("/favorite", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ movie_id: movieId, favorite: {{ "false" if is_favorite else "true" }} })
      });
      if (res.ok) location.reload();
    }
  </script>
</body>
</html>
