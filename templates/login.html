<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Movie Recommendation</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ece9e6, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
    }

    .header {
      font-size: 34px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 35px;
      text-shadow: 1px 1px 2px #ccc;
    }

    .login-container {
      background: #fff;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      width: 360px;
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 28px;
      color: #333;
      font-size: 24px;
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form-group label {
      margin-bottom: 8px;
      font-size: 16px;
      color: #555;
      align-self: flex-start;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      border-color: #4caf50;
      outline: none;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .login-btn:hover {
      background-color: #45a049;
    }

    .error-message {
      color: red;
      font-size: 15px;
      text-align: center;
      margin-top: 12px;
      display: block;
    }

    .register-link {
      text-align: center;
      margin-top: 18px;
      font-size: 15px;
    }

    .register-link a {
      color: #4caf50;
      text-decoration: none;
      font-weight: bold;
    }

    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">Movie Recommendation</div>
  <div class="login-container">
    <h2>Login</h2>
    <form id="loginForm" action="/login" method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit" class="login-btn">Login</button>

      {% if error %}
        <p class="error-message">{{ error }}</p>
      {% endif %}
    </form>

    <div class="register-link">
      沒有帳號？<a href="register">註冊新帳號</a>
    </div>
  </div>
</body>
</html>
